<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองซ้อมปฏิบัติการกายภาพบำบัด</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-indigo-600 shadow-md text-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold">PTMU Booking System</h1>
            <div id="user-info" class="hidden flex items-center gap-3">
                <span id="user-display" class="text-sm bg-indigo-700 px-3 py-1 rounded-full"></span>
                <button onclick="logout()" class="text-xs bg-red-500 hover:bg-red-600 text-white px-2.5 py-1.5 rounded transition">ออกจากระบบ</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-grow">

        <!-- Login Section -->
        <section id="login-section" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 max-w-md mx-auto mt-10">
            <h2 class="text-xl font-bold text-slate-900 mb-2 text-center">เข้าสู่ระบบจองซ้อม</h2>
            <p class="text-sm text-slate-500 mb-6 text-center">พิมพ์รหัส 6810... หรือเลือกรายชื่อของคุณ</p>
            
            <div class="space-y-4">
                <div class="relative">
                    <label class="block text-sm font-medium text-slate-700 mb-1">ค้นหาหรือเลือกรายชื่อ (80 คน)</label>
                    <input type="text" id="search-student" placeholder="พิมพ์รหัสหรือชื่อ..." class="w-full border border-slate-300 rounded-xl p-3 text-base outline-none focus:ring-2 focus:ring-indigo-500" oninput="filterStudents()">
                    <select id="student-select" size="5" class="w-full mt-1 border border-slate-300 rounded-xl p-2 text-sm bg-white hidden" onchange="selectStudent(this)">
                        <!-- รายชื่อโหลดอัตโนมัติ -->
                    </select>
                </div>
                <div id="selected-student-display" class="text-sm font-medium text-indigo-600 bg-indigo-50 p-3 rounded-xl hidden">
                    เลือก: <span id="student-name-text"></span>
                </div>
                <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition shadow-sm">
                    เข้าสู่ระบบ
                </button>
            </div>
        </section>

        <!-- App Dashboard -->
        <section id="app-section" class="hidden space-y-6">
            
            <!-- Navigation Tabs -->
            <div class="flex bg-white rounded
